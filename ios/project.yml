name: LifeRecorder
options:
  bundleIdPrefix: com.browseruse
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  LifeRecorder:
    type: application
    platform: iOS
    sources: [LifeRecorder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.jonbennett.liferecorder
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LifeRecorder/Info.plist
    scheme:
      testTargets: [LifeRecorderTests]
  LifeRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifeRecorderTests]
    dependencies:
      - target: LifeRecorder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
